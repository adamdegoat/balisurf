<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Bali Surf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 11c3-7 9-9 14-5-4-1-6 1-7 5z%22 fill=%22%2319b3a4%22/%3E%3C/svg%3E">
<style>
  :root { --ink: #fdf7ee; --dim: rgba(253,247,238,.7); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1720; color: var(--ink); position: fixed; inset: 0;
    font: 13px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  #view canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
  #cond { top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); color: var(--dim); font-size: 12px; letter-spacing: .04em; }
  #speed { top: max(10px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #score { top: max(36px, calc(env(safe-area-inset-top) + 26px)); right: max(16px, env(safe-area-inset-right)); color: var(--dim); font-variant-numeric: tabular-nums; }
  #tube { top: 22%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .3em; opacity: 0; transition: opacity .25s; }
  #hint { top: 30%; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 600; }
  #build { position: fixed; right: 8px; bottom: 4px; color: rgba(253,247,238,.45); font-size: 9px; pointer-events: none; }
  body.playing #build { display: none; }
  #fps { bottom: 4px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 10px; }
  body:not(.playing) .ctl { display: none !important; }
  #paddle { position: fixed; left: max(22px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); width: 104px; height: 104px;
    border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(10,30,40,.28); display: grid; place-items: center;
    font-weight: 700; letter-spacing: .1em; font-size: 12px; touch-action: none; }
  #paddle.down { background: rgba(255,255,255,.3); }
  #wheel { position: fixed; right: max(22px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 132px; height: 132px; touch-action: none; }
  #wheel-in { width: 100%; height: 100%; border-radius: 50%; border: 7px solid rgba(255,255,255,.6); background: rgba(10,30,40,.22); position: relative; }
  #wheel-in::before { content: ""; position: absolute; left: 50%; top: 8%; width: 7px; height: 84%; margin-left: -3.5px; background: rgba(255,255,255,.45); border-radius: 3px; }
  #wheel-in::after { content: ""; position: absolute; top: 50%; left: 8%; height: 7px; width: 84%; margin-top: -3.5px; background: rgba(255,255,255,.45); border-radius: 3px; }
  #wheel-in i { position: absolute; left: 50%; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #ffb46a; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; padding: 0 30px; }
  #msg-t { font-size: 22px; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #msg-s { margin-top: 6px; color: var(--dim); font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #sess { margin-top: 14px; color: var(--dim); font-size: 12px; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 max(7vw, env(safe-area-inset-left)); background: rgba(8,14,20,.35); }
  #start h1 { margin: 0; font: 800 clamp(34px, 7vw, 64px)/0.95 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -.02em; }
  #start p { margin: 8px 0 20px; color: var(--dim); max-width: 32em; }
  #start .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #start button { font: 600 13px "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); background: rgba(8,14,20,.35); border: 1.5px solid rgba(253,247,238,.6); padding: 12px 16px; border-radius: 3px; min-width: 104px; text-align: left; }
  #start button small { display: block; font-weight: 400; color: var(--dim); margin-top: 3px; font-size: 11px; }
  #start button:active { background: rgba(253,247,238,.18); }
  #rotate { position: fixed; inset: 0; display: none; place-items: center; background: #0d1720; color: var(--dim); z-index: 10; text-align: center; padding: 30px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: grid; } }
</style>
</head>
<body>
<div id="view"></div>
<div class="hud" id="cond"></div>
<div class="hud" id="speed"></div>
<div class="hud" id="score"></div>
<div class="hud" id="tube">BARREL</div>
<div class="hud" id="hint"></div>
<div class="hud" id="fps"></div>
<div class="ctl" id="paddle">PADDLE</div>
<div class="ctl" id="wheel"><div id="wheel-in"><i></i></div></div>
<div id="msg"><div id="msg-t"></div><div id="msg-s"></div><div id="sess"></div></div>
<div id="start">
  <h1>Bali Surf</h1>
  <p>A right-hand reef break. Hold paddle to catch the wave, steer with the wheel, stay in the pocket.</p>
  <div class="row">
    <button data-mode="easy">Easy<small>Sunny, small and soft</small></button>
    <button data-mode="medium">Medium<small>Sunset, head-high barrels</small></button>
    <button data-mode="hard">Hard<small>Storm, big and heavy</small></button>
    <button data-mode="random">Random<small>Anything can roll in</small></button>
  </div>
</div>
<small id="build">build 260924-1351</small>
<div id="rotate">Turn your phone sideways.</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }
</script>
<script type="module" src="js/game.js?v=28"></script>
</body>
</html>
